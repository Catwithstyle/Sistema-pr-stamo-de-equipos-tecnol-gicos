spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Secreto solo para pruebas (no es el de produccion)
app.jwt.secret=secreto-solo-para-pruebas-automatizadas-0123456789
app.jwt.expiration-minutes=5
app.cors.allowed-origins=http://localhost:5173

app.seed.enabled=true
app.seed.sample-data=false
app.seed.admin-password=Admin123*
app.seed.user-password=User123*
