spring.application.name=prestamos-equipos
server.port=${SERVER_PORT:8080}

# --- Base de datos (PostgreSQL). Valores por defecto solo para desarrollo local ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tecnouam}
spring.datasource.username=${DB_USER:tecnouam}
spring.datasource.password=${DB_PASSWORD:tecnouam}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT: el secreto NO se escribe en el repositorio; se lee de variable de entorno ---
# Debe tener al menos 32 caracteres. Ver .env.example y README.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- CORS: origen del frontend React (Vite por defecto) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Usuarios de prueba (se crean al iniciar si no existen). Sobrescribir por entorno ---
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123*}
app.seed.user-password=${SEED_USER_PASSWORD:User123*}
app.seed.enabled=${SEED_ENABLED:true}
# Equipos de ejemplo para la demostracion (solo si la tabla esta vacia)
app.seed.sample-data=${SEED_SAMPLE_DATA:true}
